name: Generate Guitar Wave with Live2D Character

on:
  # 每天午夜與正午自動執行兩次 (定時更新貢獻圖)
  schedule:
    - cron: "0 0,12 * * *"

  # 允許在 GitHub Actions 頁面手動點擊觸發
  workflow_dispatch:

  # 當 main 或 master 分支有更新時觸發
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Commit Grid Data
        uses: Platane/snk@v3
        with:
          # 使用當前倉庫擁有者的 GitHub ID
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Transform into Guitar Soundwave Grid
        run: |
          echo "Transforming into Clean Guitar Soundwave Visualizer with Live2D Character..."
          python3 scripts/convert_to_guitar_wave.py dist/github-contribution-grid-snake.svg assets/char_retina.webp dist/github-contribution-grid-snake.svg light
          python3 scripts/convert_to_guitar_wave.py dist/github-contribution-grid-snake-dark.svg assets/char_retina.webp dist/github-contribution-grid-snake-dark.svg dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
